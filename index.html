<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #25D366;
            --primary-dark: #128C7E;
            --dark: #222;
            --light: #f4f6f8;
            --white: #ffffff;
            --gray: #777;
            --danger: #dc3545;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 80px;
        }

        header {
            background: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-dark);
        }

        .header-btns {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-icon-btn, .admin-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            position: relative;
            color: var(--dark);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -8px;
            background: red;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .slider-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slider-container img.active-slide {
            opacity: 1;
        }

        .slide-dots {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 5;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        .dot.active-dot {
            background: var(--primary);
            width: 10px;
            height: 10px;
        }

        .delete-product-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .service-type-badge {
            background: #e3f2fd;
            color: #0d47a1;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 8px;
            width: fit-content;
        }

        .wholesale-badge {
            background: #fff3cd;
            color: #856404;
            font-size: 0.75rem;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-price {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        .add-to-cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .add-to-cart-btn:hover {
            background: var(--primary-dark);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            left: 15px;
            top: 15px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-item-controls button {
            width: 25px;
            height: 25px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            border-radius: 4px;
            cursor: pointer;
        }

        .payment-option-box {
            background: #f8f9fa;
            border: 1px dashed #ccc;
            padding: 8px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 0.85rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .admin-panel {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border: 2px solid var(--primary-dark);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .image-upload-box {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            background: #fafafa;
        }

        .image-upload-box i {
            font-size: 2rem;
            color: var(--gray);
        }

        .preview-images {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .preview-images img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--primary-dark);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 14px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bag-shopping"></i> متجري</div>
        <div class="header-btns">
            <button class="cart-icon-btn" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="admin-btn" onclick="openAdminLogin()" title="لوحة المالك">
                <i class="fa-solid fa-user-gear"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- لوحة التحكم للمالك -->
        <div id="adminPanel" class="admin-panel hidden">
            <h3><i class="fa-solid fa-plus-circle"></i> إضافة خدمة / منتج جديد (المالك)</h3>
            <hr style="margin: 10px 0 20px 0;">
            <form id="addProductForm" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label>نوع الخدمة / المنتج:</label>
                    <select id="serviceType" required>
                        <option value="data_excel">تحليل البيانات وإكسيل</option>
                        <option value="web_dev">تصميم وتطوير مواقع إلكترونية</option>
                        <option value="marketing">تسويق إلكتروني لمنتج</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الصور (يمكن اختيار أكثر من صورة):</label>
                    <div class="image-upload-box" onclick="document.getElementById('productImages').click()">
                        <i class="fa-solid fa-plus"></i>
                        <p id="uploadText">اضغط هنا لفتح معرض الصور</p>
                        <input type="file" id="productImages" multiple accept="image/*" class="hidden" onchange="previewImages(event)">
                    </div>
                    <div class="preview-images" id="previewContainer"></div>
                </div>
                <div class="form-group">
                    <label>الاسم:</label>
                    <input type="text" id="productTitle" required placeholder="أدخل اسم الخدمة أو المنتج">
                </div>
                <div class="form-group">
                    <label>الوصف:</label>
                    <textarea id="productDesc" rows="3" required placeholder="أدخل الوصف التفصيلي"></textarea>
                </div>
                <div class="form-group">
                    <label>السعر الأساسي (جنية/ر.س):</label>
                    <input type="number" id="productPrice" min="1" step="0.01" required placeholder="0.00">
                </div>
                <button type="submit" id="submitBtn" class="add-to-cart-btn" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-share-from-square"></i> نشر الخدمة / المنتج
                </button>
                <button type="button" onclick="logoutAdmin()" style="width: 100%; margin-top: 5px; background: #666;" class="add-to-cart-btn">تسجيل الخروج</button>
            </form>
        </div>

        <!-- شبكة عرض المنتجات -->
        <h2 style="margin-bottom: 15px;">الخدمات والمنتجات المتاحة</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleCart()">&times;</span>
            <h3>سلة التسوق <i class="fa-solid fa-basket-shopping"></i></h3>
            <hr style="margin: 10px 0;">
            <div id="cartItemsContainer"></div>
            <hr style="margin: 15px 0;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem;">
                <span>الإجمالي النهائي:</span>
                <span id="cartTotal">0</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر واتساب
            </button>
        </div>
    </div>

    <!-- نافذة دخول المالك -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleLogin()">&times;</span>
            <h3>تسجيل دخول المالك</h3>
            <hr style="margin: 10px 0;">
            <div class="form-group">
                <label>اسم المستخدم:</label>
                <input type="text" id="adminUser">
            </div>
            <div class="form-group">
                <label>كلمة السر:</label>
                <input type="password" id="adminPass">
            </div>
            <button class="checkout-btn" onclick="loginAdmin()">دخول</button>
        </div>
    </div>

    <div id="toast" class="toast">تم العملية بنجاح!</div>

    <script>
        const OWNER_PHONE = "201036333006"; 
        let products = JSON.parse(localStorage.getItem('my_products')) || [];
        let cart = [];
        let uploadedImagesBase64 = [];
        let slideIntervals = [];

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "1234";

        window.onload = function() {
            if (sessionStorage.getItem('isAdmin') === 'true') {
                document.getElementById('adminPanel').classList.remove('hidden');
            }
            renderProducts();
            updateCartUI();
        };

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max_size = 600;

                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function previewImages(event) {
            const files = event.target.files;
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            uploadedImagesBase64 = [];

            if (files.length === 0) return;

            document.getElementById('uploadText').innerText = "جاري معالجة الصور...";

            let processedCount = 0;
            Array.from(files).forEach(file => {
                compressImage(file, function(compressedBase64) {
                    uploadedImagesBase64.push(compressedBase64);
                    const img = document.createElement('img');
                    img.src = compressedBase64;
                    container.appendChild(img);
                    
                    processedCount++;
                    if(processedCount === files.length) {
                        document.getElementById('uploadText').innerText = "تم اختيار الصور بنجاح!";
                    }
                });
            });
        }

        function saveProduct(e) {
            e.preventDefault();

            if (uploadedImagesBase64.length === 0) {
                alert("يرجى اختيار صورة واحدة على الأقل للمنتج!");
                return;
            }

            const serviceType = document.getElementById('serviceType').value;
            const title = document.getElementById('productTitle').value.trim();
            const desc = document.getElementById('productDesc').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);

            if (!title || !desc || isNaN(price)) {
                alert("يرجى ملء كافة البيانات بشكل صحيح!");
                return;
            }

            const newProduct = {
                id: Date.now(),
                serviceType: serviceType,
                title: title,
                desc: desc,
                price: price,
                images: [...uploadedImagesBase64]
            };

            try {
                products.push(newProduct);
                localStorage.setItem('my_products', JSON.stringify(products));

                renderProducts();
                document.getElementById('addProductForm').reset();
                document.getElementById('previewContainer').innerHTML = '';
                document.getElementById('uploadText').innerText = "اضغط هنا لفتح معرض الصور";
                uploadedImagesBase64 = [];

                showToast("تم نشر العنصر بنجاح!");
            } catch (err) {
                alert("تعذر الحفظ: الذاكرة ممتلئة بالكامل، يمكنك مسح بعض العناصر القديمة لتفريغ المساحة.");
            }
        }

        function deleteProduct(id) {
            if (confirm("هل أنت تأكد من رغبتك في حذف هذا العنصر؟")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('my_products', JSON.stringify(products));
                
                cart = cart.filter(c => c.id !== id);
                updateCartUI();
                renderProducts();
                showToast("تم الحذف بنجاح!");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "toast show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function clearAllSlideIntervals() {
            slideIntervals.forEach(interval => clearInterval(interval));
            slideIntervals = [];
        }

        function renderProducts() {
            clearAllSlideIntervals();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const isAdmin = sessionStorage.getItem('isAdmin') === 'true';

            if (products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; font-size:1.1rem; color:#666;">لا توجد عناصر حالياً. أضف أول عنصر لك!</p>';
                return;
            }

            [...products].reverse().forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let deleteBtn = '';
                if (isAdmin) {
                    deleteBtn = `<button class="delete-product-btn" onclick="deleteProduct(${p.id})" title="حذف العنصر"><i class="fa-solid fa-trash"></i> حذف</button>`;
                }

                let serviceTag = '';
                let discountBadge = '';

                if (p.serviceType === 'data_excel') {
                    serviceTag = 'تحليل البيانات وإكسيل';
                    discountBadge = `
                        <div class="wholesale-badge">
                            📊 <strong>عروض خصم الإكسيل والبيانات:</strong><br>
                            - شيتين (2) = خصم 10%<br>
                            - 3 إلى 4 شيتات = خصم 15%<br>
                            - 5+ شيتات = خصم 20% + 🎁 لوحة تحكم (Dashboard) مجاناً!
                        </div>
                    `;
                } else if (p.serviceType === 'web_dev') {
                    serviceTag = 'تصميم وتطوير مواقع';
                    discountBadge = `
                        <div class="wholesale-badge">
                            💳 <strong>خيارات الدفع والخصم:</strong><br>
                            - الدفع بالتقسيط المريح المباشر<br>
                            - 🎁 <strong>خصم 10%</strong> عند السداد الكامل المسبق!
                        </div>
                    `;
                } else {
                    serviceTag = 'تسويق إلكتروني';
                    discountBadge = `
                        <div class="wholesale-badge">
                            🎁 <strong>عروض الخصم للجملة:</strong><br>
                            - 10 قطع = خصم 5% على السعر<br>
                            - 25 قطعة = خصم 10% على السعر<br>
                            - 50 قطعة = خصم 15% + 🎁 10 قطع مجاناً!
                        </div>
                    `;
                }

                let imagesHTML = '';
                let dotsHTML = '';
                
                p.images.forEach((imgSrc, index) => {
                    const activeClass = index === 0 ? 'active-slide' : '';
                    imagesHTML += `<img src="${imgSrc}" class="${activeClass}" id="slide_${p.id}_${index}" alt="${p.title}">`;
                    dotsHTML += `<span class="dot ${index === 0 ? 'active-dot' : ''}" id="dot_${p.id}_${index}"></span>`;
                });

                const sliderWrapper = `
                    <div class="slider-container">
                        ${imagesHTML}
                        ${p.images.length > 1 ? `<div class="slide-dots">${dotsHTML}</div>` : ''}
                    </div>
                `;

                card.innerHTML = `
                    ${deleteBtn}
                    ${sliderWrapper}
                    <div class="product-info">
                        <span class="service-type-badge">${serviceTag}</span>
                        <div class="product-title">${p.title}</div>
                        <div class="product-desc">${p.desc}</div>
                        ${discountBadge}
                        <div class="product-price">${p.price} ج.م/ر.س</div>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">
                            <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                if (p.images.length > 1) {
                    let currentSlide = 0;
                    const interval = setInterval(() => {
                        const prevIndex = currentSlide;
                        currentSlide = (currentSlide + 1) % p.images.length;

                        const prevImg = document.getElementById(`slide_${p.id}_${prevIndex}`);
                        const nextImg = document.getElementById(`slide_${p.id}_${currentSlide}`);
                        const prevDot = document.getElementById(`dot_${p.id}_${prevIndex}`);
                        const nextDot = document.getElementById(`dot_${p.id}_${currentSlide}`);

                        if (prevImg && nextImg) {
                            prevImg.classList.remove('active-slide');
                            nextImg.classList.add('active-slide');
                        }

                        if (prevDot && nextDot) {
                            prevDot.classList.remove('active-dot');
                            nextDot.classList.add('active-dot');
                        }
                    }, 2500);

                    slideIntervals.push(interval);
                }
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(c => c.id === productId);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title,
                    price: product.price,
                    serviceType: product.serviceType,
                    qty: 1,
                    paymentType: 'full'
                });
            }

            updateCartUI();
            showToast("تمت الإضافة إلى السلة!");
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(c => c.id !== id);
            }

            updateCartUI();
        }

        function setPaymentType(id, type) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.paymentType = type;
                updateCartUI();
            }
        }

        function calculateItemTotal(item) {
            let baseTotal = item.price * item.qty;
            let discountPercent = 0;
            let freeUnits = 0;
            let freeDashboard = false;

            if (item.serviceType === 'data_excel') {
                if (item.qty >= 5) {
                    discountPercent = 20;
                    freeDashboard = true;
                } else if (item.qty >= 3) {
                    discountPercent = 15;
                } else if (item.qty === 2) {
                    discountPercent = 10;
                }
            } else if (item.serviceType === 'web_dev') {
                if (item.paymentType === 'full') {
                    discountPercent = 10;
                }
            } else if (item.serviceType === 'marketing') {
                if (item.qty >= 50) {
                    discountPercent = 15;
                    freeUnits = 10;
                } else if (item.qty >= 25) {
                    discountPercent = 10;
                } else if (item.qty >= 10) {
                    discountPercent = 5;
                }
            }

            let discountAmount = (baseTotal * discountPercent) / 100;
            let finalTotal = baseTotal - discountAmount;

            return {
                baseTotal,
                discountPercent,
                discountAmount,
                finalTotal,
                freeUnits,
                freeDashboard
            };
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            container.innerHTML = '';
            let grandTotal = 0;
            let totalItemsCount = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">السلة فارغة حالياً</p>';
            } else {
                cart.forEach(item => {
                    const calc = calculateItemTotal(item);
                    grandTotal += calc.finalTotal;
                    totalItemsCount += item.qty;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';

                    let paymentControls = '';
                    if (item.serviceType === 'web_dev') {
                        paymentControls = `
                            <div class="payment-option-box">
                                <strong>طريقة الدفع:</strong><br>
                                <label style="margin-left: 10px;">
                                    <input type="radio" name="pay_${item.id}" value="full" ${item.paymentType === 'full' ? 'checked' : ''} onchange="setPaymentType(${item.id}, 'full')"> دفع كامل (خصم 10%)
                                </label><br>
                                <label>
                                    <input type="radio" name="pay_${item.id}" value="installment" ${item.paymentType === 'installment' ? 'checked' : ''} onchange="setPaymentType(${item.id}, 'installment')"> بالتقسيط
                                </label>
                            </div>
                        `;
                    }

                    let giftNote = '';
                    if (calc.freeUnits > 0) giftNote += `<div style="color: green; font-size: 0.8rem; font-weight: bold;">🎁 هدية مجانية: +${calc.freeUnits} قطع مجاناً!</div>`;
                    if (calc.freeDashboard) giftNote += `<div style="color: green; font-size: 0.8rem; font-weight: bold;">🎁 هدية مجانية: تصميم لوحة تحكم (Dashboard) متكاملة!</div>`;

                    let discountNote = calc.discountPercent > 0 ? `<div style="color: #128C7E; font-size: 0.8rem;">خصم مُطبق: ${calc.discountPercent}% (${calc.discountAmount.toFixed(2)} ج.م)</div>` : '';

                    itemDiv.innerHTML = `
                        <div class="cart-item-header">
                            <div>
                                <strong>${item.title}</strong>
                                <div style="font-size:0.85rem; color:#555;">${item.price} ج.م × ${item.qty}</div>
                            </div>
                            <div class="cart-item-controls">
                                <button onclick="changeQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        ${paymentControls}
                        ${discountNote}
                        ${giftNote}
                        <div style="text-align: left; font-weight: bold; font-size: 0.95rem; color: #222;">
                            المجموع: ${calc.finalTotal.toFixed(2)} ج.م
                        </div>
                    `;
                    container.appendChild(itemDiv);
                });
            }

            cartCount.innerText = totalItemsCount;
            cartTotal.innerText = grandTotal.toFixed(2) + " ج.م/ر.س";
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('active');
        }

        function toggleLogin() {
            document.getElementById('loginModal').classList.toggle('active');
        }

        function openAdminLogin() {
            if (sessionStorage.getItem('isAdmin') === 'true') {
                document.getElementById('adminPanel').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                toggleLogin();
            }
        }

        function loginAdmin() {
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                sessionStorage.setItem('isAdmin', 'true');
                toggleLogin();
                document.getElementById('adminPanel').classList.remove('hidden');
                renderProducts();
                showToast("تم تسجيل الدخول بنجاح!");
            } else {
                alert("اسم المستخدم أو كلمة السر غير صحيحة!");
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isAdmin');
            document.getElementById('adminPanel').classList.add('hidden');
            renderProducts();
            showToast("تم تسجيل الخروج!");
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let message = "مرحباً، أريد إتمام الطلب التالي من المتجر:\n\n";
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const calc = calculateItemTotal(item);
                grandTotal += calc.finalTotal;

                message += `${index + 1}. *${item.title}*\n`;
                message += `   - الكمية: ${item.qty}\n`;
                
                if (item.serviceType === 'web_dev') {
                    const payText = item.paymentType === 'full' ? 'دفع كامل (خصم 10%)' : 'تقسيط';
                    message += `   - نظام الدفع: ${payText}\n`;
                }

                if (calc.discountPercent > 0) {
                    message += `   - الخصم: ${calc.discountPercent}%\n`;
                }

                if (calc.freeUnits > 0) {
                    message += `   - 🎁 هدية الجملة: +${calc.freeUnits} قطع مجانية\n`;
                }

                if (calc.freeDashboard) {
                    message += `   - 🎁 هدية العرض: لوحة تحكم (Dashboard) مجانية\n`;
                }

                message += `   - السعر النهائي: ${calc.finalTotal.toFixed(2)} ج.م\n\n`;
            });

            message += `*الإجمالي الكلي: ${grandTotal.toFixed(2)} ج.م*`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${OWNER_PHONE}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
